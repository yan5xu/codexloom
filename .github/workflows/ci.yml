name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Build
        run: make build

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -count=1 -race ./...

      - name: Frontend test
        run: cd web && npm run test
